name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Nota: "npm run lint" no se ejecuta aquí porque eslint no está en las
      # dependencias del proyecto (el script falla con "eslint: command not found").
      # Cuando se añada eslint, descomentar:
      # - name: Lint
      #   run: npm run lint

      - name: Comprobar tipos
        run: npx tsc --noEmit
