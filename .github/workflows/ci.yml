name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generar datos de la Biblioteca
        run: npm run biblioteca:data

      - name: Lint
        run: npm run lint

      - name: Comprobar tipos
        run: npx tsc --noEmit
